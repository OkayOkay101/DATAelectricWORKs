name: Jules behavioral evidence
run-name: ${{ inputs.operation || 'quality-adapter-selftest' }}
on:
  pull_request:
    paths:
      - '.github/quality/**'
      - '.github/workflows/jules-quality.yml'
      - 'tests/test_quality_runner.py'
  workflow_dispatch:
    inputs:
      operation:
        description: Controller operation marker
        required: true
      request:
        description: Bounded structured subject IDs and test selectors
        required: true
permissions:
  contents: read
jobs:
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_quality_runner.py -v
  proof:
    name: jules-quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate structured request and run pinned host wrapper
        env:
          QUALITY_REQUEST: ${{ inputs.request }}
          QUALITY_OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          raw = os.environ['QUALITY_REQUEST']
          if len(raw.encode()) > 32768:
              raise ValueError('Request exceeds limit')
          request = json.loads(raw)
          if request['operation'] != os.environ['QUALITY_OPERATION']:
              raise ValueError('Operation mismatch')
          pathlib.Path('/tmp/quality-request.json').write_text(raw)
          command = ['python', '.github/quality/runner.py', '--task-file', '/tmp/quality-request.json',
                     '--base', request['base_sha'], '--head', request['subject_head_sha'],
                     '--profile', '.github/quality/profile.json']
          raise SystemExit(subprocess.run(command, timeout=780).returncode)
          PY
      - name: Upload host-generated report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jules-quality-v2
          path: quality-report.json
          if-no-files-found: error
          retention-days: 7
