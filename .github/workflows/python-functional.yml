name: Python Functional Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Each merge commit needs its own result for the Jules post-merge gate.
  group: python-functional-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  python-functional:
    name: python-functional
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install analyzer test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test analyzer behavior (not syntax)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
