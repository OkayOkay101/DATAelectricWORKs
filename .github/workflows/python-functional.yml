name: Python Functional Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Each merge commit needs its own result for the Jules post-merge gate.
  group: python-functional-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  python-functional:
    name: python-functional
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analyzer test dependencies
        run: pip install -r requirements-test.txt
      - name: Test analyzer behavior (not syntax)
        run: python -m unittest discover -s tests -p "test_*.py" -v
