name: Python Baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer main commit must not cancel verification of an earlier merge.
  group: python-baseline-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  python-syntax:
    name: python-syntax
    runs-on: [self-hosted, Windows, dataelectric-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse source syntax without importing application code
        run: python scripts/check_python_syntax.py
